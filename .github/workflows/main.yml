name: ci
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
concurrency:
  # Cancels pending runs when a PR gets updated.
  group: ${{ github.head_ref || github.run_id }}-${{ github.actor }}
  cancel-in-progress: true
jobs:
  lint-and-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{matrix.os}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: 'true'
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2  # Match build.zig.zon rather than unpinned master/nightly
      - name: Check format
        continue-on-error: true
        run: zig fmt --check .
      - name: Build all native
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if zig build -Dexperiments 2>&1 | tee zig-build.log; then
              exit 0
            fi
            # Only retry the transient remote download failure. Compiler
            # errors and linker errors must still fail on the first attempt.
            if ! grep -Fq 'invalid HTTP response: HttpConnectionClosing' zig-build.log || [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::Zig package download connection closed; retrying (attempt $attempt/3)"
            sleep $((attempt * 10))
          done
      - name: Cross compile Linux->Windows
        if: runner.os == 'Linux'
        run: zig build -Dtarget=x86_64-windows-gnu
      # - name: Build for Web
      #   run: zig build -Dtarget=wasm32-emscripten
        

